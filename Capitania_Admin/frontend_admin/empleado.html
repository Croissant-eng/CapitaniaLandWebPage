<!DOCTYPE html>
<html lang="es">
 
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        (function () {
            var token = sessionStorage.getItem('capitania_token');
            if (!token) {
                window.location.replace('index.html');
                return;
            }
            try {
                JSON.parse(atob(token.split('.')[1]));
            } catch (e) {
                sessionStorage.removeItem('capitania_token');
                sessionStorage.removeItem('capitania_user');
                window.location.replace('index.html');
                return;
            }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitanía - Panel de Empleado</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
 
<body>
 
    <button class="hamburger" id="menuBtn" onclick="toggleSidebar()" aria-label="Menú">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
 
    <aside class="sidebar">
        <div class="sidebar-header">
            <img src="/Images/Galeria/Opcion%201/Logo%20Capitania%20Transparente.png" alt="Capitanía"
                style="width: 100%; max-width: 160px; filter: drop-shadow(0 0 10px rgba(200, 134, 10, .5));">
        </div>
        <ul class="nav-menu">
            <li class="nav-item active" onclick="switchTab('reservas'); closeSidebar()">📅 Gestión de Reservas</li>
            <li class="nav-item" onclick="switchTab('historial'); closeSidebar()">📋 Historial del Día</li>
        </ul>
    </aside>
 
    <main class="main-content">
        <div class="topbar">
            <h1 id="pageTitle">Gestión de Reservas</h1>
            <div>
                <span style="margin-right: 1rem; color: var(--muted); font-size: 0.9rem;">Hola, <span id="userName">Empleado</span></span>
                <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
            </div>
        </div>
 
        <!-- ── TAB: RESERVAS ── -->
        <section id="tab-reservas" class="tab-content active">
            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                <div>
                    <label style="font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; display: block; margin-bottom: 0.4rem;">Filtrar por Sucursal</label>
                    <select id="filtroSucursal" onchange="filtrarReservas()" style="padding: 0.6rem 1rem; background: var(--dark2); border: 1px solid rgba(200,134,10,0.3); color: var(--cream); border-radius: 4px; font-size: 0.9rem; cursor: pointer;">
                        <option value="">Todas las sucursales</option>
                        <option value="Campestre">Campestre</option>
                        <option value="J. Vértiz Campero">J. Vértiz Campero</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; display: block; margin-bottom: 0.4rem;">Filtrar por Fecha</label>
                    <input type="date" id="filtroFecha" onchange="filtrarReservas()" style="padding: 0.6rem 1rem; background: var(--dark2); border: 1px solid rgba(200,134,10,0.3); color: var(--cream); border-radius: 4px; font-size: 0.9rem;">
                </div>
            </div>
 
            <div style="overflow-x: auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Sucursal</th>
                            <th>Fecha y Hora</th>
                            <th>Personas</th>
                            <th>Teléfono</th>
                            <th>Estatus</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="reservasTableBody">
                    </tbody>
                </table>
            </div>
        </section>
 
        <!-- ── TAB: HISTORIAL DEL DÍA ── -->
        <section id="tab-historial" class="tab-content">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                <div>
                    <label style="font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; display: block; margin-bottom: 0.4rem;">Seleccionar Fecha</label>
                    <input type="date" id="historialFecha" style="padding: 0.6rem 1rem; background: var(--dark2); border: 1px solid rgba(200,134,10,0.3); color: var(--cream); border-radius: 4px; font-size: 0.9rem;">
                </div>
                <button class="btn-primary" style="width: auto; padding: 0.7rem 1.5rem;" onclick="loadHistorialDia()">Buscar</button>
            </div>
            <div id="historialResumen" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;"></div>
            <div id="historialLista"></div>
        </section>
 
    </main>
 
    <script src="js/empleado.js"></script>
    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }
        function closeSidebar() {
            document.querySelector('.sidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('open');
        }
    </script>
</body>
 
</html>
