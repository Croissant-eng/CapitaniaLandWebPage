<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitanía - Panel de Administración</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <h1>Capitanía Admin</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <p id="loginError" style="color: var(--danger); font-size: 0.8rem; margin-bottom: 1rem; display: none;">Credenciales incorrectas.</p>
                <button type="submit" id="btnLogin" class="btn-primary">Ingresar</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const API_BASE = 'http://localhost:3001';

        if (localStorage.getItem('capitania_token')) {
            window.location.href = 'dashboard.html';
        }

        let loginEnProceso = false;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (loginEnProceso) return;
            loginEnProceso = true;

            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerText = 'Ingresando...';

            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const err = document.getElementById('loginError');
            err.style.display = 'none';

            try {
                const res = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username: u, password: p })
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    localStorage.setItem('capitania_token', data.token);
                    localStorage.setItem('capitania_user', data.username);
                    window.location.href = 'dashboard.html';
                } else {
                    err.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = 'Ingresar';
                    loginEnProceso = false;
                }
            } catch (error) {
                err.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Ingresar';
                loginEnProceso = false;
            }
        });
    </script>
</body>
</html>
