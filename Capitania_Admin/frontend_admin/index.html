<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitanía - Panel de Administración</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <h1>Capitanía Admin</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <p id="loginError" style="color: var(--danger); font-size: 0.8rem; margin-bottom: 1rem; display: none;">Credenciales incorrectas.</p>
                <button type="submit" class="btn-primary">Ingresar</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Check if already logged in
        if (localStorage.getItem('capitania_token')) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const err = document.getElementById('loginError');
            
            try {
                const res = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                
                if (!res.ok) throw new Error('Login fallido');
                
                const data = await res.json();
                localStorage.setItem('capitania_token', data.token);
                localStorage.setItem('capitania_user', data.username);
                window.location.href = 'dashboard.html';
            } catch (error) {
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
