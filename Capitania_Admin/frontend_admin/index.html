<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitanía - Panel de Administración</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <h1>Capitanía Admin</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <p id="loginError" style="color: var(--danger); font-size: 0.8rem; margin-bottom: 1rem; display: none;">Credenciales incorrectas.</p>
                <button type="submit" id="btnLogin" class="btn-primary">Ingresar</button>
            </form>
        </div>
    </div>

    <script src="js/app.js?v=20260612"></script>
    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3001'
            : 'https://7mzq2kk1-3001.usw3.devtunnels.ms';

        // Si ya hay token, redirigir según rol
        const existingToken = localStorage.getItem('capitania_token');
        if (existingToken) {
            try {
                const payload = JSON.parse(atob(existingToken.split('.')[1]));
                if (payload.role === 'empleado') {
                    window.location.href = 'empleado.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (e) {
                localStorage.removeItem('capitania_token');
            }
        }

        let loginEnProceso = false;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (loginEnProceso) return;
            loginEnProceso = true;

            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerText = 'Ingresando...';

            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const err = document.getElementById('loginError');
            err.style.display = 'none';

            // Intentar login como admin primero, luego como empleado
            let data = null;
            let ok = false;

            try {
                const res = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username: u, password: p })
                });
                if (res.ok) {
                    data = await res.json();
                    if (data.token) ok = true;
                }
            } catch (e) {}

            // Si no entró como admin, intentar como empleado
            if (!ok) {
                try {
                    const res2 = await fetch(`${API_BASE}/api/empleado/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ username: u, password: p })
                    });
                    if (res2.ok) {
                        data = await res2.json();
                        if (data.token) ok = true;
                    }
                } catch (e) {}
            }

            if (ok && data && data.token) {
                localStorage.setItem('capitania_token', data.token);
                localStorage.setItem('capitania_user', data.username);
                // Decodificar rol del token
                try {
                    const payload = JSON.parse(atob(data.token.split('.')[1]));
                    if (payload.role === 'empleado') {
                        window.location.href = 'empleado.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } catch (e) {
                    window.location.href = 'dashboard.html';
                }
            } else {
                err.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Ingresar';
                loginEnProceso = false;
            }
        });
    </script>
</body>
</html>
